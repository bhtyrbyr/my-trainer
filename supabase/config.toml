# Supabase CLI config (local dev). Hosted project settings are managed in the dashboard.
project_id = "my-trainer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# The DB trigger still blocks non-whitelisted emails. Set this to false in the hosted dashboard after first login.
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = true
