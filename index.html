<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us use env(safe-area-inset-*) on iPhone (Dynamic Island / home bar) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#111309" />
    <!-- private app (owner + invited people): keep it out of search engines; public/robots.txt too -->
    <meta name="robots" content="noindex, nofollow" />
    <script src="/theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
  </head>
  <body class="bg-bg text-ink ">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
