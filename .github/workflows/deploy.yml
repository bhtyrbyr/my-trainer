# Production pipeline: runs only after the CI workflow succeeds on main.
#   1. Supabase: push migrations, deploy Edge Functions
#   2. Vercel: build + production deploy
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD    database password set when the project was created
#   VERCEL_TOKEN            vercel.com/account/tokens
#   VERCEL_ORG_ID           from `vercel link` -> .vercel/project.json
#   VERCEL_PROJECT_ID       from `vercel link` -> .vercel/project.json
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are configured in the Vercel project (pulled by `vercel pull`).
# Optional, for reminder notifications (docs/faz3-spec.md section 5); without them the feature stays hidden:
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY   from `npx web-push generate-vapid-keys`
#   PUSH_DISPATCH_SECRET                  any long random string (e.g. `openssl rand -hex 32`)
name: Deploy (production)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase migrations + functions
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0 # pinned: "latest" resolves through the GitHub API and fails when rate-limited
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy Edge Functions (if any)
        run: |
          if [ -d supabase/functions ] && [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "no edge functions yet"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Reminders: function secrets + the dispatch URL/secret the database cron uses. Skipped until the
      # three GitHub secrets exist. Values never reach the logs (masked) or the client bundle.
      - name: Configure push reminders
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$PUSH_DISPATCH_SECRET" ]; then
            echo "push reminders not configured (VAPID_* / PUSH_DISPATCH_SECRET secrets missing)"; exit 0
          fi
          subject="mailto:$(jq -r .legal.contactEmail src/config/brand.json)"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$subject" PUSH_DISPATCH_SECRET="$PUSH_DISPATCH_SECRET"
          jq -n --arg url "$SUPABASE_URL/functions/v1/push-send" --arg secret "$PUSH_DISPATCH_SECRET" \
            '{p_url: $url, p_secret: $secret}' |
            curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/set_push_config" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" --data-binary @- > /dev/null
          echo "push reminders configured"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Curated Turkish foods every deploy; USDA only on the first load; then a batch of missing Turkish names.
      # Never blocks the app deploy.
      - name: Food catalog sync
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/sync-foods.mjs --if-empty --translate-limit=1500
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Exercise catalog v2 (wger + workout-guide, docs/catalog-v2-spec.md): rows and SVG frames, then at most
      # 30 Gemini Flash Lite translation requests (the user reserve is kept). Never blocks the app deploy.
      - name: Exercise catalog sync
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/sync-catalog.mjs --translate-limit=30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  vercel:
    name: Vercel production deploy
    needs: supabase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Vercel "Sensitive" env vars are not downloadable by `vercel pull`, so the client config
      # comes from GitHub Secrets here (public anon key + URL; nothing privileged).
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      - name: Verify the bundle contains the Supabase URL
        run: grep -rq "supabase.co" .vercel/output/static/assets/*.js || (echo "::error::VITE_SUPABASE_URL missing from build" && exit 1)
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
