# Monthly refresh of the exercise catalog (ExerciseDB exercises + GIFs, wger muscles + SVGs)
# into Supabase. Idempotent: existing media is skipped, rows are upserted, user edits kept.
# The service_role key lives only in GitHub Secrets (never in the repo or the browser bundle).
name: Sync exercise catalog
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month, 03:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit to one source'
        type: choice
        options: ['', 'exercisedb', 'wger']
        default: ''
      skip_media:
        description: 'Skip GIF/SVG download and upload'
        type: boolean
        default: false
      dry_run:
        description: 'Fetch and report only, write nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-exercises
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Inputs go through env, never interpolated into the script (no shell injection).
          IN_ONLY: ${{ inputs.only }}
          IN_SKIP_MEDIA: ${{ inputs.skip_media }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=""
          case "$IN_ONLY" in exercisedb|wger) flags="$flags --only=$IN_ONLY" ;; esac
          [ "$IN_SKIP_MEDIA" = "true" ] && flags="$flags --skip-media"
          [ "$IN_DRY_RUN" = "true" ] && flags="$flags --dry-run"
          node scripts/sync-exercises.mjs $flags
