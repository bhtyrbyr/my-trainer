name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run i18n:check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}
      - name: Secret scan (no service_role / provider keys in client code)
        run: |
          # 1) the privileged key must never be referenced by code shipped to the browser (CLAUDE.md rule 3).
          #    Server-side scripts (scripts/, GitHub Actions only) legitimately use it via env.
          if grep -rniE "service_role" src; then
            echo "::error::service_role referenced in client code"; exit 1; fi
          # 2) real key shapes anywhere (patterns below contain brackets, so they never match themselves)
          if grep -rnE "AIza[0-9A-Za-z_-]{30,}|sk-or-v1-[0-9a-f]{20,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{40,}" src scripts supabase .github --exclude-dir=node_modules; then
            echo "::error::possible secret committed to repo"; exit 1; fi
      - name: RLS sanity (every table in migrations has RLS enabled)
        run: |
          fail=0
          for f in supabase/migrations/*.sql; do
            for t in $(grep -oiE "create table (if not exists )?public\.[a-z_]+" "$f" | awk '{print $NF}' | sed 's/public\.//'); do
              grep -qiE "alter table public\.$t enable row level security" "$f" || { echo "::error file=$f::table $t has no RLS"; fail=1; }
            done
          done
          exit $fail

  db-tests:
    name: Database + E2E tests (local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # config.toml reads these for the (unused in tests) Google provider
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0 # pinned: "latest" resolves through the GitHub API and fails when rate-limited
      - name: Start local stack (applies every migration + seed)
        run: supabase start -x studio,imgproxy,inbucket,mailpit,realtime,edge-runtime,logflare,vector,supavisor || supabase start
      - name: Run pgTAP suite
        run: supabase test db
      # E2E (Playwright, Chromium) against the same local stack; not part of release:check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npm run test:e2e
        env:
          SUPABASE_BIN: supabase
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup

  preview:
    name: Vercel preview deploy (PRs)
    if: github.event_name == 'pull_request'
    needs: [check, db-tests]
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            })
