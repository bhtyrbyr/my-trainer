# Supabase free tier pauses projects after ~7 days without activity.
# This pings the REST endpoint daily so the project stays awake even if you skip the gym for a week.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/allowed_emails?select=email&limit=1")
          echo "HTTP $code"
          # 200 (empty array thanks to RLS) or 401/403 both prove the project is awake.
          case "$code" in 200|401|403) exit 0;; *) exit 1;; esac
