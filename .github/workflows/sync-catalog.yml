# Monthly refresh of the exercise catalog (wger exercises + workout-guide frames, ExerciseDB id matching,
# AI-written steps where the source has none, Turkish instructions) and the wger muscle diagrams into
# Supabase. Idempotent: existing media is skipped, rows are upserted, user edits and manual matches kept.
# The service_role key lives only in GitHub Secrets (never in the repo or the browser bundle).
name: Sync exercise catalog
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month, 03:00 UTC
  workflow_dispatch:
    inputs:
      skip_media:
        description: 'Skip media download and upload'
        type: boolean
        default: false
      dry_run:
        description: 'Fetch and report only, write nothing'
        type: boolean
        default: false
      translate_limit:
        description: 'Max Gemini Flash Lite requests this run (ExerciseDB matching + generated steps + Turkish instructions; 0 = no AI)'
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Inputs go through env, never interpolated into the script (no shell injection).
          IN_SKIP_MEDIA: ${{ inputs.skip_media }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_TRANSLATE_LIMIT: ${{ inputs.translate_limit }}
        run: |
          flags=""
          [ "$IN_SKIP_MEDIA" = "true" ] && flags="$flags --skip-media"
          [ "$IN_DRY_RUN" = "true" ] && flags="$flags --dry-run"
          # Scheduled runs have no inputs: default 30. Digits only, anything else falls back to 30.
          limit="${IN_TRANSLATE_LIMIT:-30}"
          case "$limit" in ''|*[!0-9]*) limit=30 ;; esac
          node scripts/sync-muscles.mjs $flags
          node scripts/sync-catalog.mjs $flags --translate-limit="$limit"
