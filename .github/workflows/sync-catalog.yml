# Monthly refresh of the exercise catalog (wger exercises + workout-guide frames, Turkish names) and the
# wger muscle diagrams
# into Supabase. Idempotent: existing media is skipped, rows are upserted, user edits kept.
# The service_role key lives only in GitHub Secrets (never in the repo or the browser bundle).
name: Sync exercise catalog
on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month, 03:00 UTC
  workflow_dispatch:
    inputs:
      skip_media:
        description: 'Skip media download and upload'
        type: boolean
        default: false
      dry_run:
        description: 'Fetch and report only, write nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Inputs go through env, never interpolated into the script (no shell injection).
          IN_SKIP_MEDIA: ${{ inputs.skip_media }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=""
          [ "$IN_SKIP_MEDIA" = "true" ] && flags="$flags --skip-media"
          [ "$IN_DRY_RUN" = "true" ] && flags="$flags --dry-run"
          node scripts/sync-muscles.mjs $flags
          node scripts/sync-catalog.mjs $flags --translate-limit=30
